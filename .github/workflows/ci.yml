# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# This workflow will install Deno and run tests across stable and nightly builds on Windows, Ubuntu and macOS.
# For more information see: https://github.com/denolib/setup-deno

name: grammY

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Setup repo
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22

            - name: Install dependencies
              run: npm install --ignore-scripts

            - name: Type-check
              run: npm run check

            - name: Build package
              run: npm run build

            - name: Smoke-test package in Node.js
              run: node -e 'const plugin = require("./out/mod.js"); if (typeof plugin.openTelemetry !== "function") process.exit(1)'

            - name: Setup Deno
              uses: denoland/setup-deno@v2
              with:
                  deno-version: v2.x

            - name: Smoke-test package in Deno
              run: deno eval 'import { openTelemetry } from "./out/mod.js"; if (typeof openTelemetry !== "function") Deno.exit(1)'

    format-and-lint:
        runs-on: ubuntu-latest
        steps:
            - name: Setup repo
              uses: actions/checkout@v4

            - uses: denoland/setup-deno@v2
              with:
                  deno-version: v2.x

            - name: Check Format
              run: deno fmt --check

            - name: Lint
              run: deno lint
