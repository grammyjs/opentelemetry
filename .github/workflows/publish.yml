name: Stage npm package

on:
    push:
        tags:
            - "*.*.*"

permissions:
    contents: read
    id-token: write

jobs:
    stage:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Setup Node.js
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 24.19.0
                  registry-url: https://registry.npmjs.org
                  package-manager-cache: false

            - name: Setup Deno
              uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
              with:
                  deno-version: v2.x

            - name: Install dependencies
              run: npm ci --ignore-scripts

            - name: Verify release version
              run: |
                  PACKAGE_VERSION="$(node --print "require('./package.json').version")"
                  if [ "${GITHUB_REF_NAME}" != "${PACKAGE_VERSION}" ]; then
                      echo "::error::Tag ${GITHUB_REF_NAME} does not match package version ${PACKAGE_VERSION}"
                      exit 1
                  fi

            - name: Build package
              run: npm run backport

            - name: Smoke-test package in Node.js
              run: node -e 'const plugin = require("./out/mod.js"); if (typeof plugin.openTelemetry !== "function") process.exit(1)'

            - name: Smoke-test package in Deno
              run: deno eval 'import { openTelemetry } from "./out/mod.js"; if (typeof openTelemetry !== "function") Deno.exit(1)'

            - name: Stage package on npm
              run: npm stage publish . --ignore-scripts
