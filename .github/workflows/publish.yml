name: Publish

on:
    push:
        tags:
            - "*.*.*"

permissions:
    contents: write
    id-token: write

jobs:
    publish:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  persist-credentials: false

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: 24
                  registry-url: https://registry.npmjs.org
                  package-manager-cache: false

            - name: Setup Deno
              uses: denoland/setup-deno@v2
              with:
                  deno-version: v2.x

            - name: Install dependencies
              run: npm ci --ignore-scripts

            - name: Verify release version
              run: |
                  PACKAGE_VERSION="$(node --print "require('./package.json').version")"
                  if [ "${GITHUB_REF_NAME}" != "${PACKAGE_VERSION}" ]; then
                      echo "::error::Tag ${GITHUB_REF_NAME} does not match package version ${PACKAGE_VERSION}"
                      exit 1
                  fi

            - name: Build package
              run: npm run backport

            - name: Smoke-test package in Node.js
              run: node -e 'const plugin = require("./out/mod.js"); if (typeof plugin.openTelemetry !== "function") process.exit(1)'

            - name: Smoke-test package in Deno
              run: deno eval 'import { openTelemetry } from "./out/mod.js"; if (typeof openTelemetry !== "function") Deno.exit(1)'

            - name: Publish to npm
              run: npm publish --ignore-scripts

            - name: Release
              uses: softprops/action-gh-release@v3
              with:
                  generate_release_notes: true
                  prerelease: true
